server:
  port: 8081

spring:
  application:
    name: m-crm
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    drop-first: false
  web:
    resources:
      static-locations: classpath:/static/
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    hibernate:
      ddl-auto: validate

gg:
  jte:
    developmentMode: true
    contentType: Html
    templateLocation: src/main/resources/jte

email:
  validation:
    base-url: ${EMAIL_VALIDATION_URL:http://localhost:8089}

logging:
  level:
    org.springframework.web: DEBUG
    ru.mentee.power.crm: DEBUG
    gg.jte: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    liquibase: DEBUG
    org.liquibase: DEBUG
    liquibase.integration: DEBUG
