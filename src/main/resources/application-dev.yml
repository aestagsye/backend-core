spring:
  liquibase:
    drop-first: false
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  datasource:
    url: jdbc:postgresql://localhost:5432/crm
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false

logging:
  level:
    liquibase: TRACE
    org.springframework.boot.autoconfigure.liquibase: TRACE

# Внешние API
email:
  validation:
    base-url: ${EMAIL_VALIDATION_URL:http://localhost:8089}
