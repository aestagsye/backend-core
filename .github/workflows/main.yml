name: Java CI with Checkstyle and JaCoCo

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Build the project
        run: ./gradlew --no-daemon build -x test

      # Проверка наличия schema.sql
      - name: Check schema.sql
        run: |
          ls -la src/main/resources/
          if [ -f src/main/resources/schema.sql ]; then
            echo "schema.sql found, first 10 lines:"
            head -n 10 src/main/resources/schema.sql
          else
            echo "ERROR: schema.sql not found in src/main/resources/"
            exit 1
          fi

      # Запускаем Servlet приложение в фоне
      - name: Start Servlet application
        run: |
          ./gradlew --no-daemon run &
          echo $! > servlet.pid
          sleep 10

      # Запускаем Spring Boot приложение в фоне с сохранением лога
      - name: Start Spring Boot application
        run: |
          ./gradlew --no-daemon bootRun -Dspring.profiles.active=test > spring.log 2>&1 &
          echo $! > spring.pid
          sleep 30  # увеличиваем время ожидания старта
          echo "=== Last 100 lines of spring.log ==="
          tail -n 100 spring.log || true

      # Проверяем, что серверы запустились
      - name: Wait for servers to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8080/leads; do sleep 2; done'
          timeout 60 bash -c 'until curl -f http://localhost:8081/leads; do sleep 2; done' || (echo "Spring Boot failed to start. Full log:" && cat spring.log && exit 1)

      - name: Run Checkstyle
        run: ./gradlew --no-daemon checkstyleMain

      - name: Run tests
        run: ./gradlew --no-daemon test

      - name: Generate JaCoCo report
        run: ./gradlew --no-daemon jacocoTestReport

      - name: Verify code coverage
        run: ./gradlew --no-daemon jacocoTestCoverageVerification

      # Останавливаем серверы после тестов
      - name: Stop servers
        if: always()
        run: |
          kill $(cat servlet.pid) || true
          kill $(cat spring.pid) || true
          rm -f servlet.pid spring.pid
